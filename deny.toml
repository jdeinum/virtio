[advisories]
unmaintained = "workspace"
yanked = "deny"


[licenses]
allow = ["MIT", "Unicode-3.0"]
confidence-threshold = 0.8
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [{ crate = "syn" }]
